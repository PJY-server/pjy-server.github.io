<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>SurviveInSchool · PJY Server</title><link rel="stylesheet" href="/assets/pjy-app.css"></head><body><main class="app"><div class="top"><div class="brand">PJY</div><div><a class="back" href="/">← PJY Server</a><div class="eyebrow">STUDENT PLANNER</div></div></div><h1 class="title">SurviveInSchool 📚</h1><p class="subtitle">시간표부터 숙제, 수행평가, 준비물, D-day까지 한곳에서 관리해.</p><section class="panel"><h2 class="section-title">일정 추가</h2><div class="grid"><div class="field"><label for="kind">종류</label><select id="kind"><option>숙제</option><option>준비물</option><option>수행평가</option><option>D-day</option></select></div><div class="field"><label for="date">날짜</label><input id="date" class="input" type="date"></div></div><div class="field"><label for="task">내용</label><input id="task" class="input" placeholder="예: 수학 익힘책 45쪽"></div><div class="row"><button id="add" class="btn">일정 저장</button><button id="clear" class="btn secondary">완료한 항목 지우기</button></div><p class="muted">일정은 현재 이 브라우저에 저장돼. 다른 기기와 공유하는 기능은 계정/클라우드 연동 단계에서 추가할 거야.</p></section><section style="margin-top:20px"><h2 class="section-title">다가오는 일정</h2><div id="tasks" class="stack"></div></section><section style="margin-top:22px" class="panel"><h2 class="section-title">시간표</h2><p class="muted">시간표를 입력해 저장할 수 있어. 입력 내용은 이 기기에 보관돼.</p><div class="field"><label for="timetable">요일별 시간표</label><textarea id="timetable" rows="5" placeholder="월: 국어, 수학, 영어, 과학, 체육&#10;화: ..."></textarea></div><button class="btn secondary" id="saveTable">시간표 저장</button><span id="saved" class="small" style="margin-left:10px"></span></section><section style="margin-top:20px" class="panel"><h2 class="section-title">급식 메모</h2><div class="field"><label for="mealDate">날짜</label><input class="input" type="date" id="mealDate"></div><div class="field"><label for="meal">메뉴</label><textarea id="meal" rows="2" placeholder="급식 메뉴 메모"></textarea></div><button class="btn secondary" id="saveMeal">급식 메모 저장</button><div id="meals" style="margin-top:12px" class="stack"></div><p class="muted">자동 급식 조회는 학교 정보 API 연결 단계에서 추가할 예정이야.</p></section><div class="footer">PJY Server · SurviveInSchool</div></main><script>
const $=s=>document.querySelector(s),KEY='pjy_school_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"table":"","meals":[]}');const today=new Date().toISOString().slice(0,10);$('#date').value=today;$('#mealDate').value=today;$('#timetable').value=data.table;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let tasks=[...data.tasks].sort((a,b)=>a.date.localeCompare(b.date));$('#tasks').innerHTML=tasks.length?tasks.map(t=>'<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">'+esc(t.kind)+'</span><span class="small">'+esc(t.date||'날짜 없음')+'</span></div><div style="font-weight:750;margin:10px 0">'+esc(t.text)+'</div><div class="row"><label class="muted"><input type="checkbox" data-done="'+t.id+'" '+(t.done?'checked':'')+'> 완료</label><button class="btn secondary" data-del="'+t.id+'">삭제</button></div></div>').join(''):'<div class="empty">아직 일정이 없어. 위에서 하나 추가해 봐!</div>';document.querySelectorAll('[data-done]').forEach(x=>x.onchange=()=>{let t=data.tasks.find(t=>t.id===x.dataset.done);t.done=x.checked;save();render()});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==x.dataset.del);save();render()});$('#meals').innerHTML=data.meals.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>'<div class="result"><b>'+esc(m.date)+'</b><div>'+esc(m.text)+'</div><button class="btn secondary" data-meal-del="'+m.id+'" style="margin-top:8px">삭제</button></div>').join('')||'<div class="muted">저장된 급식 메모가 없어.</div>';document.querySelectorAll('[data-meal-del]').forEach(b=>b.onclick=()=>{data.meals=data.meals.filter(m=>m.id!==b.dataset.mealDel);save();render()})}$('#add').onclick=()=>{let text=$('#task').value.trim();if(!text){alert('내용을 입력해 줘.');return}data.tasks.push({id:crypto.randomUUID(),kind:$('#kind').value,date:$('#date').value,text,done:false});$('#task').value='';save();render()};$('#clear').onclick=()=>{data.tasks=data.tasks.filter(t=>!t.done);save();render()};$('#saveTable').onclick=()=>{data.table=$('#timetable').value;save();$('#saved').textContent='저장 완료 ✓';setTimeout(()=>$('#saved').textContent='',1800)};$('#saveMeal').onclick=()=>{let text=$('#meal').value.trim();if(!text)return alert('급식 메뉴를 입력해 줘.');data.meals.push({id:crypto.randomUUID(),date:$('#mealDate').value,text});$('#meal').value='';save();render()};render();
</script></body></html>
