<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#35a853"><title>FriendsChat Cloudflare</title>
<style>
:root{--g:#35a853;--p:#eaf8e8;--bg:#f4f7f5;--line:#e5ebe6;--muted:#758078}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:#202820}button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:white;font-weight:700;cursor:pointer}.secondary{background:#edf1ee;color:#354238}.hidden{display:none!important}.field{width:100%;border:1px solid #dbe3dc;border-radius:11px;padding:12px;margin:6px 0;outline-color:var(--g)}#auth{min-height:100dvh;display:grid;place-items:center;padding:18px;background:linear-gradient(140deg,#dff5d9,#f8fff5)}.authbox{width:min(100%,400px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 14px 44px #244a2514}.brand{text-align:center;font-weight:900;font-size:30px}.brand span{color:var(--g)}.sub{text-align:center;color:var(--muted);margin:4px 0 22px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.error{color:#b62d2d;font-size:13px;min-height:20px;margin-top:8px}#app{height:100dvh;max-width:1200px;margin:auto;background:white;display:grid;grid-template-columns:310px minmax(0,1fr)}.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.top{padding:15px;border-bottom:1px solid var(--line)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:5px;margin-top:12px}.tabs button{flex:1;padding:8px 4px;font-size:12px}.list{overflow:auto;flex:1}.item{padding:12px 14px;border-bottom:1px solid #f0f2f0;cursor:pointer}.item:hover,.item.selected{background:var(--p)}.item b,.item small{display:block}.item small{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sidebottom{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}.sidebottom button{flex:1;font-size:12px}.chat{min-width:0;display:flex;flex-direction:column}.chathead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#fbfcfb}.msg{max-width:78%;align-self:flex-start;background:white;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#e6f8e1;border-color:#d7efcf;border-radius:14px 14px 4px 14px}.msgmeta{font-size:11px;color:var(--muted);margin-bottom:4px}.msgtext{font-size:14px;line-height:1.5}.filelink{display:block;color:#16833a;text-decoration:underline;cursor:pointer;margin-top:7px;font-size:13px}.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}.composer textarea{resize:none;min-height:43px;max-height:130px;flex:1;border:1px solid #dbe3dc;border-radius:12px;padding:11px}.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}.modal{position:fixed;inset:0;background:#10201066;display:grid;place-items:center;padding:16px;z-index:10}.modalbox{background:white;border-radius:18px;padding:20px;width:min(100%,600px);max-height:85dvh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}@media(max-width:700px){#app{grid-template-columns:1fr}.chat{display:none}.chat.open{display:flex;position:fixed;inset:0;background:white;z-index:2}.side.chatting{display:none}.messages{padding:12px}.msg{max-width:88%}}
</style></head><body>
<section id="auth"><div class="authbox"><div class="brand">Friends<span>Chat</span></div><div class="sub">Cloudflare Edition</div>
<div id="loginForm"><input id="loginName" class="field" autocomplete="username" placeholder="아이디"><input id="loginPass" class="field" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="actions"><button id="loginBtn">로그인</button><button class="secondary" id="showSignup">회원가입</button></div></div>
<div id="signupForm" class="hidden"><input id="signupName" class="field" placeholder="아이디 (영문/숫자/_ 3~20자)"><input id="signupDisplay" class="field" placeholder="닉네임"><input id="signupPass" class="field" type="password" placeholder="비밀번호 (8자 이상)"><div class="actions"><button id="signupBtn">가입하고 시작</button><button class="secondary" id="showLogin">로그인으로</button></div></div><div id="authError" class="error"></div></div></section>
<section id="app" class="hidden"><aside id="sidebar" class="side"><div class="top"><div class="toprow"><div><div class="brand" style="font-size:22px">Friends<span>Chat</span></div><div id="myName" class="small"></div></div><button class="secondary" id="logoutBtn">로그아웃</button></div>
<div class="tabs"><button id="roomsTab">대화</button><button class="secondary" id="usersTab">회원 찾기</button><button class="secondary" id="friendsTab">친구</button></div><input id="search" class="field" placeholder="검색 / 친구 아이디" style="margin-bottom:0"><div class="actions"><button id="searchBtn" class="secondary">검색</button><button id="addFriendBtn" class="secondary">친구 추가</button></div><button id="groupBtn" class="secondary" style="width:100%;margin-top:7px">＋ 단체 채팅 만들기</button><button id="adminBtn" class="secondary hidden" style="width:100%;margin-top:7px">관리자 회원 관리</button></div><div id="sideList" class="list"></div><div class="sidebottom"><button class="secondary" id="renameBtn">닉네임 변경</button><button class="secondary" id="refreshBtn">새로고침</button></div></aside>
<main id="chat" class="chat"><header class="chathead"><div><b id="chatTitle">FriendsChat</b><div id="chatSub" class="small">대화방을 선택하세요</div></div><button id="backBtn" class="secondary hidden">← 목록</button></header><div id="messages" class="messages"><div class="empty">친구나 대화방을 선택해 줘!</div></div><form id="composer" class="composer"><input id="fileInput" type="file" class="hidden"><button type="button" id="attachBtn" class="secondary">＋</button><textarea id="messageInput" rows="1" placeholder="메시지 입력..." disabled></textarea><button id="sendBtn" disabled>전송</button></form></main></section>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">FriendsChat</h3><button id="closeModal" class="secondary">닫기</button></div><div id="modalBody"></div></div></div>
<script>
const API_BASE="https://friendschat-api.YOUR-SUBDOMAIN.workers.dev";
const $=id=>document.getElementById(id);let token=localStorage.getItem("fc_cloudflare_token")||"",me=null,rooms=[],users=[],friends=[],activeRoom=null,activeTab="rooms",pollTimer=null;
async function api(path,opt={}){const h=new Headers(opt.headers||{});if(token)h.set("Authorization","Bearer "+token);if(opt.body&&!(opt.body instanceof FormData))h.set("Content-Type","application/json");const r=await fetch(API_BASE+path,{...opt,headers:h});const ct=r.headers.get("content-type")||"";if(!ct.includes("application/json")){if(!r.ok)throw Error("API 오류 ("+r.status+")");return r}const d=await r.json();if(!r.ok)throw Error(d.error||"요청에 실패했습니다.");return d}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function authView(signup){$("auth").classList.remove("hidden");$("app").classList.add("hidden");$("loginForm").classList.toggle("hidden",signup);$("signupForm").classList.toggle("hidden",!signup);$("authError").textContent=""}
async function login(){try{$("authError").textContent="";const d=await api("/auth/login",{method:"POST",body:JSON.stringify({username:$("loginName").value.trim(),password:$("loginPass").value})});saveToken(d.token);await enterApp(d.user)}catch(e){$("authError").textContent=e.message}}
async function signup(){try{$("authError").textContent="";const d=await api("/auth/signup",{method:"POST",body:JSON.stringify({username:$("signupName").value.trim(),displayName:$("signupDisplay").value.trim(),password:$("signupPass").value})});saveToken(d.token);await enterApp(d.user)}catch(e){$("authError").textContent=e.message}}
function saveToken(t){token=t;localStorage.setItem("fc_cloudflare_token",t)}
async function enterApp(u){me=u;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("myName").textContent=u.display_name+" (@"+u.username+")";$("adminBtn").classList.toggle("hidden",!u.is_admin);await refreshAll();if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>refreshAll(true).catch(()=>{}),3500)}
async function logout(){try{await api("/auth/logout",{method:"POST"})}catch{}if(pollTimer)clearInterval(pollTimer);localStorage.removeItem("fc_cloudflare_token");token="";me=null;activeRoom=null;authView(false)}
async function refreshAll(silent){if(!token)return;try{const d=await api("/auth/me");me=d.user;$("myName").textContent=me.display_name+" (@"+me.username+")";$("adminBtn").classList.toggle("hidden",!me.is_admin);const res=await Promise.all([api("/rooms"),api("/users"),api("/friends")]);rooms=res[0].rooms||[];users=res[1].users||[];friends=res[2].friends||[];renderSide();if(activeRoom){const r=rooms.find(x=>x.id===activeRoom.id);if(r)activeRoom=r;await loadMessages(true)}}catch(e){if(!silent&&e.message.includes("로그인"))await logout();else if(!silent)alert(e.message)}}
function setTab(t){activeTab=t;["roomsTab","usersTab","friendsTab"].forEach((id,i)=>$(id).className=["rooms","users","friends"][i]===t?"":"secondary");renderSide()}
function roomTitle(r){if(r.name)return r.name;return (r.members||[]).filter(m=>m.id!==me.id).map(m=>m.display_name).join(", ")||"대화방"}
function renderSide(){const q=$("search").value.trim().toLowerCase();let items=[];if(activeTab==="rooms"){items=rooms.filter(r=>(r.name||"").toLowerCase().includes(q)||(r.members||[]).some(m=>(m.display_name+" "+m.username).toLowerCase().includes(q))).map(r=>({kind:"room",id:r.id,title:roomTitle(r),sub:r.last_message||((r.members||[]).length+"명 참여"),data:r}))}else{const base=activeTab==="friends"?friends:users;items=base.filter(u=>(u.username+" "+u.display_name).toLowerCase().includes(q)).map(u=>({kind:"user",id:u.id,title:u.display_name,sub:"@"+u.username+" · "+(u.status==="online"?"온라인":"오프라인"),data:u}))}
$("sideList").innerHTML=items.length?items.map(x=>'<div class="item '+(x.kind==="room"&&activeRoom&&activeRoom.id===x.id?"selected":"")+'" data-kind="'+x.kind+'" data-id="'+esc(x.id)+'"><b>'+esc(x.title)+'</b><small>'+esc(x.sub)+'</small></div>').join(""):'<div class="empty">표시할 항목이 없어.</div>';
$("sideList").querySelectorAll(".item").forEach(el=>el.onclick=()=>{const x=items.find(v=>v.id===el.dataset.id);if(x.kind==="room")openRoom(x.data);else startChat(x.data)})}
async function startChat(u){try{const d=await api("/rooms",{method:"POST",body:JSON.stringify({usernames:[u.username],is_group:false})});await refreshAll(true);openRoom(rooms.find(r=>r.id===d.room.id)||d.room)}catch(e){alert(e.message)}}
async function openRoom(r){activeRoom=r;$("chat").classList.add("open");$("sidebar").classList.add("chatting");$("backBtn").classList.remove("hidden");$("chatTitle").textContent=roomTitle(r);$("chatSub").textContent=(r.members||[]).map(m=>m.display_name).join(", ");$("messageInput").disabled=false;$("sendBtn").disabled=false;await loadMessages();try{await api("/rooms/"+encodeURIComponent(r.id)+"/read",{method:"POST"})}catch{}}
function back(){ $("chat").classList.remove("open");$("sidebar").classList.remove("chatting");$("backBtn").classList.add("hidden")}
async function loadMessages(silent){if(!activeRoom)return;try{const d=await api("/rooms/"+encodeURIComponent(activeRoom.id)+"/messages?limit=80"),box=$("messages"),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.innerHTML=(d.messages||[]).map(m=>'<div class="msg '+(m.sender_id===me.id?"mine":"")+'"><div class="msgmeta">'+esc(m.sender_name||m.sender_username)+' · '+esc(new Date(m.created_at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}))+'</div><div class="msgtext">'+esc(m.content)+'</div>'+((m.files||[]).map(f=>'<a href="#" class="filelink" data-file="'+esc(f.id)+'">📎 '+esc(f.file_name)+' ('+Math.ceil(f.size_bytes/1024)+' KB)</a>').join(""))+'</div>').join("")||'<div class="empty">첫 메시지를 보내 봐!</div>';box.querySelectorAll("[data-file]").forEach(a=>a.onclick=e=>{e.preventDefault();downloadFile(a.dataset.file)});if(!silent||bottom)box.scrollTop=box.scrollHeight}catch(e){if(!silent)alert(e.message)}}
async function sendMessage(content){if(!activeRoom||!content.trim())return;const text=content.trim();$("messageInput").value="";try{await api("/rooms/"+encodeURIComponent(activeRoom.id)+"/messages",{method:"POST",body:JSON.stringify({content:text})});await loadMessages();await refreshAll(true)}catch(e){alert(e.message)}}
$("composer").onsubmit=e=>{e.preventDefault();sendMessage($("messageInput").value)};$("messageInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}}
async function downloadFile(id){try{const r=await api("/files/"+encodeURIComponent(id)),blob=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="FriendsChat-file";a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}}
$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=async()=>{const f=$("fileInput").files[0];if(!f||!activeRoom)return;if(f.size>20*1024*1024){alert("파일은 20MB 이하만 첨부할 수 있어.");return}try{const d=await api("/rooms/"+encodeURIComponent(activeRoom.id)+"/messages",{method:"POST",body:JSON.stringify({content:"📎 파일 첨부: "+f.name})}),form=new FormData();form.append("file",f);form.append("message_id",d.message.id);await api("/rooms/"+encodeURIComponent(activeRoom.id)+"/files",{method:"POST",body:form});await loadMessages()}catch(e){alert(e.message)}finally{$("fileInput").value=""}}
$("searchBtn").onclick=()=>renderSide();$("search").oninput=renderSide;$("addFriendBtn").onclick=async()=>{const username=$("search").value.trim();if(!username){alert("친구 아이디를 검색창에 입력해 줘.");return}try{await api("/friends",{method:"POST",body:JSON.stringify({username})});alert("친구로 추가했어!");setTab("friends");await refreshAll(true)}catch(e){alert(e.message)}}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden")}$("closeModal").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()}
$("groupBtn").onclick=()=>modal("단체 채팅 만들기",'<label>방 이름</label><input id="groupName" class="field" placeholder="예: 우리 반"><label>참가 아이디 (쉼표로 구분)</label><input id="groupUsers" class="field" placeholder="friend1, friend2"><button id="makeGroup" style="width:100%">방 만들기</button>');
$("modalBody").onclick=async e=>{if(e.target.id==="makeGroup"){try{const d=await api("/rooms",{method:"POST",body:JSON.stringify({name:$("groupName").value.trim(),usernames:$("groupUsers").value.split(",").map(x=>x.trim()).filter(Boolean),is_group:true})});closeModal();await refreshAll(true);openRoom(rooms.find(r=>r.id===d.room.id)||d.room)}catch(err){alert(err.message)}}};
$("renameBtn").onclick=async()=>{const n=prompt("새 닉네임",me.display_name);if(!n||!n.trim())return;try{const d=await api("/profile",{method:"PATCH",body:JSON.stringify({display_name:n.trim()})});me=d.user;$("myName").textContent=me.display_name+" (@"+me.username+")";await refreshAll(true)}catch(e){alert(e.message)}};
$("adminBtn").onclick=async()=>{try{const d=await api("/admin/users");let html='<div style="overflow:auto"><table><thead><tr><th>닉네임</th><th>아이디</th><th>권한</th><th>변경</th></tr></thead><tbody>';html+=(d.users||[]).map(u=>'<tr><td>'+esc(u.display_name)+'</td><td>'+esc(u.username)+'</td><td>'+(u.is_admin?"관리자":"회원")+'</td><td>'+(u.id===me.id?"현재 계정":'<button class="secondary" data-admin="'+esc(u.id)+'" data-next="'+(!u.is_admin)+'">'+(u.is_admin?"관리자 해제":"관리자 지정")+'</button>')+'</td></tr>').join("");html+='</tbody></table></div>';modal("관리자 · 회원 관리",html);$("modalBody").querySelectorAll("[data-admin]").forEach(b=>b.onclick=async()=>{try{await api("/admin/users/"+encodeURIComponent(b.dataset.admin)+"/admin",{method:"PATCH",body:JSON.stringify({is_admin:b.dataset.next==="true"})});$("adminBtn").click()}catch(e){alert(e.message)}})}catch(e){alert(e.message)}};
$("showSignup").onclick=()=>authView(true);$("showLogin").onclick=()=>authView(false);$("loginBtn").onclick=login;$("signupBtn").onclick=signup;$("logoutBtn").onclick=logout;$("refreshBtn").onclick=()=>refreshAll();$("backBtn").onclick=back;$("roomsTab").onclick=()=>setTab("rooms");$("usersTab").onclick=()=>setTab("users");$("friendsTab").onclick=()=>setTab("friends");
(async()=>{if(API_BASE.includes("YOUR-SUBDOMAIN")){authView(false);$("authError").textContent="배포한 Worker 주소를 API_BASE에 입력해 줘.";return}if(token){try{const d=await api("/auth/me");await enterApp(d.user)}catch{localStorage.removeItem("fc_cloudflare_token");token="";authView(false)}}else authView(false)})();
</script></body></html>
