<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>놀맵 (NolMap)</title>

    <!-- Pretendard -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- 상단 -->
    <header class="header">

        <h1 class="logo">놀맵</h1>

        <div class="searchBox">
            <input
                id="searchInput"
                type="text"
                placeholder="목적지를 검색하세요">

            <button id="searchBtn">
                검색
            </button>
        </div>

    </header>


    <!-- 지도 -->
    <main>

        <div id="map"></div>

    </main>


    <!-- 현재위치 -->
    <button id="locationBtn">

        📍

    </button>


    <!-- 하단 메뉴 -->

    <nav class="bottomNav">

        <button class="navItem active">
            🏠
            <span>홈</span>
        </button>

        <button class="navItem">
            🗺️
            <span>지도</span>
        </button>

        <button class="navItem">
            ⭐
            <span>즐겨찾기</span>
        </button>

        <button class="navItem">
            ⚙️
            <span>설정</span>
        </button>

    </nav>

</div>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- GraphHopper -->
<script src="https://unpkg.com/graphhopper-js-api-client/dist/graphhopper-client.js"></script>

<!-- JS -->
<script src="script.js"></script>
<script src="map.js"></script>

</body>
</html>
