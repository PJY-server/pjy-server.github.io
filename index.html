<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet OpenStreetMap 지도</title>

  <!-- 1. Leaflet CSS (HTTPS 필수) -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    /* 기본 리셋 및 화면 전체를 지도로 채우기 위한 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
    }

    /* 지도가 표시될 컨테이너에는 반드시 높이(height)가 지정되어야 합니다 */
    #map {
      width: 100%;
      height: 100vh; /* 화면 전체 채우기 */
    }
  </style>
</head>
<body>

  <!-- 지도가 들어갈 엘리먼트 -->
  <div id="map"></div>

  <!-- 2. Leaflet JS (HTTPS 필수) -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script>
    // 1. 지도 중심점 및 기본 줌 레벨 설정 (위도, 경도, 줌레벨)
    // 예: 서울시청 [37.5665, 126.9780], 줌 13
    const map = L.map('map').setView([37.5665, 126.9780], 13);

    // 2. OpenStreetMap 타일 레이어 추가 (HTTPS URL 사용)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 3. 기본 마커(핀) 위치 설정 및 팝업 창 연결
    const marker = L.marker([37.5665, 126.9780]).addTo(map);
    
    // 팝업 내용 세팅 및 클릭 시 자동 오픈
    marker.bindPopup('<b>안녕하세요!</b><br>pjy-server의 지도 서비스입니다.').openPopup();

    // 4. 지도 클릭 시 클릭한 곳의 위도/경도 팝업 띄우기 (옵션 기능)
    const popup = L.popup();
    function onMapClick(e) {
      popup
        .setLatLng(e.latlng)
        .setContent(`클릭한 위치<br>위도: ${e.latlng.lat.toFixed(5)}<br>경도: ${e.latlng.lng.toFixed(5)}`)
        .openOn(map);
    }
    map.on('click', onMapClick);
  </script>

</body>
</html>
