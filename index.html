<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>안전 보행 지도</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    :root {
      --primary-color: #5BB8DB;
      --bg-color: #F8FAFC;
      --text-color: #1E293B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #E2E8F0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 모바일 프레임 컨테이너 */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    /* 화면 스위칭 영역 */
    .screens {
      flex: 1;
      position: relative;
      overflow-y: auto;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
    }

    .screen.active {
      display: block;
    }

    /* 지도 영역 */
    #leaflet-map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 커스텀 마커 기본 스타일 */
    .custom-leaflet-icon {
      background: none;
      border: none;
    }

    /* 하단 탭 바 */
    .nav-bar {
      height: 65px;
      background-color: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #94A3B8;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: none;
      width: 100%;
    }

    .tab.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* 홈 스크린 임시 레이아웃 */
    .home-content {
      padding: 24px;
      color: var(--text-color);
    }
    .home-content h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 화면 영역들 -->
  <div class="screens">
    
    <!-- 1. 홈 화면 -->
    <div id="screen-home" class="screen active">
      <div class="home-content">
        <h1>안전 보행 가이드</h1>
        <p>하단 지도 탭을 누르면 내 위치에서 신도림 놀구로까지의 보행자 전용 경로를 확인하실 수 있습니다.</p>
      </div>
    </div>

    <!-- 2. 지도 화면 -->
    <div id="screen-map" class="screen">
      <div id="leaflet-map"></div>
    </div>

  </div>

  <!-- 하단 탭 바 -->
  <nav class="nav-bar">
    <button class="tab active" data-tab="home" onclick="go('home')">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>홈</span>
    </button>
    <button class="tab" data-tab="map" onclick="go('map')">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9A1 1 0 0 0 3 5.8v14.3a1 1 0 0 0 1.37.93l5.63-2.13 6 2.1 5.64-1.9A1 1 0 0 0 22 18.2V3.9a1 1 0 0 0-1.5-.9zM15 17.61l-6-2.1v-11l6 2.1z"/></svg>
      <span>지도</span>
    </button>
  </nav>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
  let leafletMap = null;
  let userMarker = null;
  let routeLine = null;

  // 주요 기준 좌표
  const NOLGURO           = [37.4977, 126.8878]; // 도착지: 신도림 놀구로
  const SINMIRIM_BACKGATE = [37.5008, 126.8896]; // 오차 보정용 출발지: 서울신미림초 후문

  const DANGER_SPOT   = [37.4995, 126.8883];
  const ANGEL_SPOT    = [37.4990, 126.8874];
  const DISCOVER_SPOT = [37.4983, 126.8891];

  // 탭 전환 logic
  function go(name){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab[data-tab="' + name + '"]').classList.add('active');

    // 지도가 위치한 탭으로 진입 시 렌더링 영역 크기 재계산
    if (name === 'map' && leafletMap){
      setTimeout(() => {
        leafletMap.invalidateSize();
      }, 100);
    }
  }

  // Custom SVG 마커 생성기
  function createCustomIcon(hexColor, glyph) {
    const glyphs = {
      danger: '<circle cx="15" cy="15" r="11" fill="' + hexColor + '"/><text x="15" y="19.5" font-size="13" font-weight="800" fill="white" text-anchor="middle" font-family="Pretendard, sans-serif">!</text>',
      angel:  '<circle cx="15" cy="15" r="11" fill="' + hexColor + '"/><path d="M11 13.5c-2.6 0-3.6 2-3.6 4M19 13.5c2.6 0 3.6 2 3.6 4" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(0,-1)"/><circle cx="15" cy="12.5" r="2.6" fill="white"/>',
      factory:'<circle cx="15" cy="15" r="11" fill="' + hexColor + '"/><path d="M10 18v-5l2.5 1.7v-3.4L15 13v-3.4l2.5 1.7V18H10Z" fill="white"/>',
      dot:    '<circle cx="15" cy="15" r="8" fill="' + hexColor + '" stroke="white" stroke-width="2"/><circle cx="15" cy="15" r="3" fill="white"/>'
    };
    
    return L.divIcon({
      html: `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">${glyphs[glyph]}</svg>`,
      className: 'custom-leaflet-icon',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -15]
    });
  }

  // 보행자(Foot) 전용 길찾기 API 호출 및 연산
  async function fetchPedestrianRoute(startLat, startLng, locationName) {
    const url = `https://router.project-osrm.org/route/v1/foot/${startLng},${startLat};${NOLGURO[1]},${NOLGURO[0]}?overview=full&geometries=geojson`;

    try {
      const response = await fetch(url);
      const data = await response.json();

      if (data.routes && data.routes.length > 0) {
        // Coordinate conversion ([lng, lat] -> [lat, lng])
        const coordinates = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);

        // 기존 เส้น 지우기
        if (routeLine) leafletMap.removeLayer(routeLine);

        // 보행자 실선 표시
        routeLine = L.polyline(coordinates, {
          color: '#5BB8DB',
          weight: 6,
          opacity: 0.9,
          lineJoin: 'round'
        }).addTo(leafletMap);

        // 내 위치 마커 찍기
        if (userMarker) leafletMap.removeLayer(userMarker);
        userMarker = L.marker([startLat, startLng], { icon: createCustomIcon('#5BB8DB', 'dot') })
          .addTo(leafletMap)
          .bindPopup(`<b>${locationName}</b>`)
          .openPopup();

        // 경로에 맞춰 화면 확대/축소 자동 조절
        leafletMap.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
      }
    } catch (err) {
      console.error('보행자 경로 계산 실패:', err);
    }
  }

  // 지도 초기화
  function initLeafletMap() {
    leafletMap = L.map('leaflet-map', { zoomControl: false }).setView(NOLGURO, 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(leafletMap);

    // 주요 거점 마커 생성
    L.marker(NOLGURO, { icon: createCustomIcon('#2E7A99', 'dot') }).addTo(leafletMap).bindPopup('<b>도착: 신도림 놀구로</b>');
    L.marker(DANGER_SPOT, { icon: createCustomIcon('#E53E3E', 'danger') }).addTo(leafletMap).bindPopup('<b>위험요소:</b> 좁은 골목');
    L.marker(ANGEL_SPOT, { icon: createCustomIcon('#F4B942', 'angel') }).addTo(leafletMap).bindPopup('<b>구로엔젤:</b> 안전 상주');
    L.marker(DISCOVER_SPOT, { icon: createCustomIcon('#B5714A', 'factory') }).addTo(leafletMap).bindPopup('<b>삼대발견:</b> 공장 터');

    // 위치 추적 실행
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          fetchPedestrianRoute(pos.coords.latitude, pos.coords.longitude, '내 위치');
        },
        (err) => {
          // PC나 GPS 거부 시 기본 안전 위치로 연결
          fetchPedestrianRoute(SINMIRIM_BACKGATE[0], SINMIRIM_BACKGATE[1], '서울신미림초등학교 후문');
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      fetchPedestrianRoute(SINMIRIM_BACKGATE[0], SINMIRIM_BACKGATE[1], '서울신미림초등학교 후문');
    }
  }

  document.addEventListener('DOMContentLoaded', initLeafletMap);
</script>

</body>
</html>
