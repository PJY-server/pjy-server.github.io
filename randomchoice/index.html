<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>RandomChoice · PJY Server</title><link rel="stylesheet" href="/assets/pjy-app.css"></head><body><main class="app"><div class="top"><div class="brand">PJY</div><div><a class="back" href="/">← PJY Server</a><div class="eyebrow">RANDOM TOOLS</div></div></div><h1 class="title">RandomChoice 🎲</h1><p class="subtitle">뭘 할지 고민될 때, 공정하게 랜덤으로 정해 보자.</p><div class="row" id="tabs"><button class="btn" data-mode="roulette">🎡 룰렛</button><button class="btn secondary" data-mode="ladder">🪜 사다리</button><button class="btn secondary" data-mode="draw">🎟️ 제비뽑기</button><button class="btn secondary" data-mode="teams">👥 팀 나누기</button><button class="btn secondary" data-mode="penalty">😆 벌칙 정하기</button></div><section class="panel" style="margin-top:16px"><h2 class="section-title" id="modeTitle">🎡 룰렛</h2><div class="field"><label for="items">항목 (쉼표 또는 줄바꿈으로 구분)</label><textarea id="items" rows="4" placeholder="예: 피자, 햄버거, 떡볶이">피자, 햄버거, 떡볶이, 김밥</textarea></div><div class="field" id="countWrap" hidden><label for="count">팀 수</label><input class="input" id="count" type="number" min="2" max="20" value="2"></div><div class="row"><button class="btn accent" id="go">랜덤 시작!</button><button class="btn secondary" id="reset">초기화</button></div><div id="visual" style="margin-top:20px"></div><div id="result" style="margin-top:14px" aria-live="polite"></div><p class="muted" style="margin-top:16px">결과는 이 기기에서 계산돼. 이름이나 민감한 정보는 입력하지 마.</p></section><div class="footer">PJY Server · RandomChoice</div></main><script>
const $=s=>document.querySelector(s);let mode='roulette';const titles={roulette:'🎡 룰렛',ladder:'🪜 사다리 타기',draw:'🎟️ 제비뽑기',teams:'👥 팀 나누기',penalty:'😆 벌칙 정하기'};const samples={penalty:'웃긴 표정 5초, 칭찬 한마디 하기, 동물 소리 내기, 다음 게임 진행자, 춤 5초, 노래 한 소절'};
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.className='btn '+(x===b?'':'secondary'));$('#modeTitle').textContent=titles[mode];$('#countWrap').hidden=mode!=='teams';$('#items').value=mode==='penalty'?samples.penalty:(mode==='teams'?'민준, 서연, 지우, 하준, 유나, 도윤':'항목 1, 항목 2, 항목 3, 항목 4');$('#result').innerHTML='';$('#visual').innerHTML=''}));
function parse(){return $('#items').value.split(/[，,\n]/).map(x=>x.trim()).filter(Boolean)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#go').addEventListener('click',()=>{let a=parse();if(a.length<2){$('#result').innerHTML='<div class="empty">항목을 2개 이상 입력해 줘!</div>';return}$('#go').disabled=true;$('#result').innerHTML='<div class="result" style="text-align:center;font-size:20px;font-weight:800">🎲 두구두구…</div>';setTimeout(()=>{let html='';if(mode==='teams'){let n=Math.max(2,Math.min(20,Number($('#count').value)||2));let shuffled=[...a].sort(()=>Math.random()-.5),teams=Array.from({length:n},()=>[]);shuffled.forEach((x,i)=>teams[i%n].push(x));html='<div class="grid">'+teams.map((t,i)=>'<div class="result"><b>'+ (i+1)+'팀</b><p>'+t.map(escapeHtml).join(', ')+'</p></div>').join('')+'</div>'}else{let chosen=pick(a);html='<div class="result" style="text-align:center;padding:28px"><div style="font-size:13px;color:#777">선택 결과</div><div style="font-size:clamp(28px,7vw,42px);font-weight:900;margin:10px 0">'+escapeHtml(chosen)+'</div><div class="muted">다시 뽑기를 눌러 새 결과를 만들 수 있어.</div></div>';if(mode==='ladder')html+='<p class="muted">간단 랜덤 결과 방식이야. 실제 선 연결형 사다리 애니메이션은 다음 업데이트에서 추가할 수 있어.</p>'}$('#result').innerHTML=html;$('#go').disabled=false},650)});
$('#reset').addEventListener('click',()=>{$('#result').innerHTML='';$('#visual').innerHTML='';$('#go').disabled=false});
</script></body></html>
