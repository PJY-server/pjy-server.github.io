name: Update kids news

on:
  push:
    paths:
      - 'edu/patch_live_news.py'
      - 'edu/fetch_news.py'
      - '.github/workflows/update-edu-news.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch news page
        run: python3 edu/patch_live_news.py

      - name: Fetch and rank kids news
        run: python3 edu/fetch_news.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edu/news.html edu/news-data.json
          git diff --cached --quiet || git commit -m "Update live kids news"
          git push
