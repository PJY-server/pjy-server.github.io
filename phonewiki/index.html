<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>PhoneWiki · PJY Server</title><link rel="stylesheet" href="/assets/pjy-app.css"></head><body><main class="app"><div class="top"><div class="brand">PJY</div><div><a class="back" href="/">← PJY Server</a><div class="eyebrow">SMARTPHONE ENCYCLOPEDIA</div></div></div><h1 class="title">PhoneWiki 📱</h1><p class="subtitle">갤럭시와 아이폰의 출시일과 주요 사양을 검색하고 비교해 보자.</p><section class="panel"><div class="field"><label for="search">기종 검색</label><input id="search" class="input" placeholder="예: iPhone 16, Galaxy S24"></div><div class="row"><button class="btn" id="find">검색</button><button class="btn secondary" id="compare">선택 기종 비교</button></div><p class="muted">현재는 예시 데이터로 화면과 비교 기능을 먼저 만들었어. 정확한 전체 기종 데이터베이스는 다음 단계에서 연결할 거야.</p></section><section style="margin-top:18px"><h2 class="section-title">기종 목록</h2><div id="list" class="grid"></div></section><section style="margin-top:22px"><h2 class="section-title">비교</h2><div id="comparison" class="panel"><div class="empty">기종 카드에서 최대 3개까지 선택해 줘.</div></div></section><div class="footer">PJY Server · PhoneWiki</div></main><script>
const phones=[{id:'ip16',name:'iPhone 16',brand:'Apple',release:'2024-09-20',camera:'48MP 메인 + 12MP 초광각',front:'12MP',weight:'170g',size:'147.6 × 71.6 × 7.8mm',display:'6.1인치 OLED',note:'예시 사양'},{id:'ip16pro',name:'iPhone 16 Pro',brand:'Apple',release:'2024-09-20',camera:'48MP 메인 + 48MP 초광각 + 12MP 망원',front:'12MP',weight:'199g',size:'149.6 × 71.5 × 8.25mm',display:'6.3인치 OLED',note:'예시 사양'},{id:'s24',name:'Galaxy S24',brand:'Samsung',release:'2024-01-31',camera:'50MP 메인 + 12MP 초광각 + 10MP 망원',front:'12MP',weight:'167g',size:'147.0 × 70.6 × 7.6mm',display:'6.2인치 AMOLED',note:'예시 사양'},{id:'s24u',name:'Galaxy S24 Ultra',brand:'Samsung',release:'2024-01-31',camera:'200MP 메인 + 12MP 초광각 + 망원 카메라 2개',front:'12MP',weight:'232g',size:'162.3 × 79.0 × 8.6mm',display:'6.8인치 AMOLED',note:'예시 사양'}];let selected=new Set();const $=s=>document.querySelector(s);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('#search').value.trim().toLowerCase();let arr=phones.filter(p=>(p.name+' '+p.brand).toLowerCase().includes(q));$('#list').innerHTML=arr.length?arr.map(p=>'<article class="card"><div class="row" style="justify-content:space-between"><span class="pill">'+p.brand+'</span><input aria-label="'+esc(p.name)+' 비교 선택" type="checkbox" data-id="'+p.id+'" '+(selected.has(p.id)?'checked':'')+'></div><h3>'+esc(p.name)+'</h3><div class="muted">출시일 · '+p.release+'</div><p class="muted">카메라 · '+esc(p.camera)+'<br>무게 · '+p.weight+'<br>크기 · '+p.size+'</p><button class="btn secondary" data-detail="'+p.id+'">상세 보기</button><div id="detail-'+p.id+'"></div></article>').join(''):'<div class="empty">검색 결과가 없어.</div>';document.querySelectorAll('[data-id]').forEach(c=>c.addEventListener('change',()=>{if(c.checked){if(selected.size>=3){c.checked=false;alert('최대 3개까지 비교할 수 있어.');return}selected.add(c.dataset.id)}else selected.delete(c.dataset.id)}));document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>{let p=phones.find(x=>x.id===b.dataset.detail);$('#detail-'+p.id).innerHTML='<div class="result" style="margin-top:12px">전면 카메라: '+esc(p.front)+'<br>디스플레이: '+esc(p.display)+'<br><span class="small">'+p.note+'</span></div>'}))}function compare(){let a=phones.filter(p=>selected.has(p.id));if(a.length<2){$('#comparison').innerHTML='<div class="empty">비교할 기종을 2개 이상 선택해 줘.</div>';return}let fields=[['출시일','release'],['후면 카메라','camera'],['전면 카메라','front'],['무게','weight'],['크기','size'],['디스플레이','display']];$('#comparison').innerHTML='<div class="table-wrap"><table><thead><tr><th>항목</th>'+a.map(p=>'<th>'+esc(p.name)+'</th>').join('')+'</tr></thead><tbody>'+fields.map(([label,k])=>'<tr><th>'+label+'</th>'+a.map(p=>'<td>'+esc(p[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="small">※ 현재는 초기 예시 데이터이며, 출시 사양 전체 검증 후 정식 데이터로 교체할 예정.</p>'}$('#find').onclick=render;$('#search').addEventListener('keydown',e=>{if(e.key==='Enter')render()});$('#compare').onclick=compare;render();
</script></body></html>
