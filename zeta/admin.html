<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETA 관리자</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:Inter,"Noto Sans KR",sans-serif;background:#080b12;color:#f8fafc}
.card{background:rgba(17,24,39,.72);border:1px solid rgba(148,163,184,.14);backdrop-filter:blur(14px)}
.stat{background:linear-gradient(135deg,rgba(30,41,59,.9),rgba(15,23,42,.8))}
button{transition:.18s}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="loading" class="fixed inset-0 flex items-center justify-center bg-[#080b12] z-50">
  <div class="text-center">
    <div class="text-3xl mb-3">⚡</div>
    <div class="font-bold">관리자 확인 중...</div>
  </div>
</div>

<div id="app" class="hidden min-h-screen">
<header class="border-b border-white/10 sticky top-0 z-30 bg-[#080b12]/90 backdrop-blur-xl">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
    <div>
      <div class="text-xs text-cyan-400 font-bold tracking-widest">ZETA ADMIN</div>
      <h1 class="text-xl sm:text-2xl font-extrabold">관리자 페이지</h1>
      <p id="admin-info" class="text-xs text-slate-400 mt-1"></p>
    </div>
    <div class="flex gap-2">
      <a href="./" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold">ZETA로</a>
      <button onclick="logout()" class="px-3 py-2 rounded-xl bg-red-500/15 text-red-300 hover:bg-red-500/25 text-xs font-semibold">로그아웃</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">회원</div><div id="user-count" class="text-2xl font-extrabold mt-1">-</div></div>
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">캐릭터</div><div id="character-count" class="text-2xl font-extrabold mt-1">-</div></div>
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">내 계정</div><div class="text-lg font-extrabold mt-1">admin</div></div>
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">상태</div><div class="text-lg font-extrabold text-emerald-400 mt-1">관리자</div></div>
  </section>

  <section class="card rounded-2xl overflow-hidden">
    <div class="px-4 py-4 border-b border-white/10 flex items-center justify-between">
      <div><h2 class="font-bold">회원 관리</h2><p class="text-xs text-slate-500 mt-1">가입된 계정을 확인하고 삭제할 수 있습니다.</p></div>
      <button onclick="loadAll()" class="px-3 py-2 rounded-xl bg-cyan-500/15 text-cyan-300 text-xs font-semibold hover:bg-cyan-500/25">새로고침</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-white/[.03] text-xs text-slate-400">
          <tr><th class="text-left px-4 py-3">아이디</th><th class="text-left px-4 py-3">닉네임</th><th class="text-left px-4 py-3">가입일</th><th class="text-right px-4 py-3">관리</th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </section>

  <section class="card rounded-2xl overflow-hidden">
    <div class="px-4 py-4 border-b border-white/10">
      <h2 class="font-bold">캐릭터 관리</h2>
      <p class="text-xs text-slate-500 mt-1">온라인에 게시된 캐릭터를 확인하고 삭제할 수 있습니다.</p>
    </div>
    <div id="characters-list" class="divide-y divide-white/10"></div>
  </section>
</main>
</div>

<script>
const WORKER = "https://zeta-ai.pjy-server.workers.dev";
const TOKEN_KEY = "zeta_session";

function token() {
  return localStorage.getItem(TOKEN_KEY);
}

async function api(path, options={}) {
  const headers = {
    ...(options.headers || {}),
    Authorization: "Bearer " + token()
  };

  const res = await fetch(WORKER + path, {...options, headers});
  const data = await res.json().catch(()=>({}));

  if (!res.ok) {
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem(TOKEN_KEY);
      location.href = "./";
    }
    throw new Error(data.error || `요청 실패 (${res.status})`);
  }
  return data;
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function date(v) {
  if (!v) return "-";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "-" : d.toLocaleString("ko-KR");
}

async function checkAdmin() {
  const t = token();
  if (!t) {
    location.href = "./";
    return;
  }

  try {
    const data = await api("/auth/me");
    if (data.user.username !== "admin") {
      alert("관리자 계정만 접근할 수 있습니다.");
      location.href = "./";
      return;
    }

    document.getElementById("admin-info").textContent =
      `${data.user.nickname} (${data.user.username})`;
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    await loadAll();
  } catch (e) {
    alert(e.message);
    location.href = "./";
  }
}

async function loadAll() {
  try {
    const [usersData, charsData] = await Promise.all([
      api("/admin/users"),
      api("/admin/characters")
    ]);

    renderUsers(usersData.users || []);
    renderCharacters(charsData.characters || []);
  } catch (e) {
    alert(e.message);
  }
}

function renderUsers(users) {
  document.getElementById("user-count").textContent = users.length;

  const body = document.getElementById("users-body");

  if (!users.length) {
    body.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">회원이 없습니다.</td></tr>`;
    return;
  }

  body.innerHTML = users.map(user => `
    <tr class="border-t border-white/5 hover:bg-white/[.025]">
      <td class="px-4 py-3 font-semibold">${esc(user.username)}</td>
      <td class="px-4 py-3 text-slate-300">${esc(user.nickname)}</td>
      <td class="px-4 py-3 text-xs text-slate-500">${date(user.createdAt)}</td>
      <td class="px-4 py-3 text-right">
        ${user.username === "admin"
          ? `<span class="text-xs text-cyan-400 font-semibold">관리자</span>`
          : `<button onclick="deleteUser('${encodeURIComponent(user.username)}')" class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-300 text-xs hover:bg-red-500/20">삭제</button>`
        }
      </td>
    </tr>
  `).join("");
}

function renderCharacters(chars) {
  document.getElementById("character-count").textContent = chars.length;
  const box = document.getElementById("characters-list");

  if (!chars.length) {
    box.innerHTML = `<div class="p-8 text-center text-slate-500">게시된 캐릭터가 없습니다.</div>`;
    return;
  }

  box.innerHTML = chars.map(c => `
    <div class="p-4 flex gap-3 items-center">
      <img src="${esc(c.avatar)}" class="w-14 h-14 rounded-xl object-cover bg-slate-800" onerror="this.style.visibility='hidden'">
      <div class="min-w-0 flex-1">
        <div class="font-bold truncate">${esc(c.name)}</div>
        <div class="text-xs text-slate-400 mt-1">
          ${esc(c.category || "기타")} · 생성자: <span class="text-cyan-300">${esc(c.creator || "ZETA Community")}</span>
        </div>
        <div class="text-[11px] text-slate-600 mt-1">${date(c.createdAt)}</div>
      </div>
      <button onclick="deleteCharacter('${encodeURIComponent(c.id)}')" class="shrink-0 px-3 py-2 rounded-xl bg-red-500/10 text-red-300 text-xs hover:bg-red-500/20">삭제</button>
    </div>
  `).join("");
}

async function deleteUser(username) {
  const name = decodeURIComponent(username);
  if (!confirm(`'${name}' 계정을 삭제할까요?\\n이 작업은 되돌릴 수 없습니다.`)) return;

  try {
    await api(`/admin/users?username=${username}`, {method:"DELETE"});
    await loadAll();
  } catch(e) {
    alert(e.message);
  }
}

async function deleteCharacter(id) {
  const value = decodeURIComponent(id);
  if (!confirm(`이 캐릭터를 삭제할까요?\\n이 작업은 되돌릴 수 없습니다.`)) return;

  try {
    await api(`/admin/characters?id=${id}`, {method:"DELETE"});
    await loadAll();
  } catch(e) {
    alert(e.message);
  }
}

async function logout() {
  try {
    await api("/auth/logout", {method:"POST"});
  } catch {}
  localStorage.removeItem(TOKEN_KEY);
  location.href = "./";
}

checkAdmin();
</script>
</body>
</html>
