<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETA 관리자</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:Inter,"Noto Sans KR",sans-serif;background:#080b12;color:#f8fafc}
.card{background:rgba(17,24,39,.72);border:1px solid rgba(148,163,184,.14);backdrop-filter:blur(14px)}
.stat{background:linear-gradient(135deg,rgba(30,41,59,.9),rgba(15,23,42,.8))}
button{transition:.18s}
button:active{transform:scale(.97)}
.modal-bg{background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.modal-card{background:#111827;border:1px solid rgba(148,163,184,.18);box-shadow:0 24px 80px rgba(0,0,0,.45)}
.input{width:100%;background:#0b1220;border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:10px 12px;color:#f8fafc;outline:none}
.input:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.08)}
.label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px;font-weight:600}
</style>
</head>
<body>
<div id="loading" class="fixed inset-0 flex items-center justify-center bg-[#080b12] z-50">
  <div class="text-center">
    <div class="text-3xl mb-3">⚡</div>
    <div class="font-bold">관리자 확인 중...</div>
  </div>
</div>

<div id="app" class="hidden min-h-screen">
<header class="border-b border-white/10 sticky top-0 z-30 bg-[#080b12]/90 backdrop-blur-xl">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
    <div>
      <div class="text-xs text-cyan-400 font-bold tracking-widest">ZETA ADMIN</div>
      <h1 class="text-xl sm:text-2xl font-extrabold">관리자 페이지</h1>
      <p id="admin-info" class="text-xs text-slate-400 mt-1"></p>
    </div>
    <div class="flex gap-2">
      <a href="./" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold">ZETA로</a>
      <button onclick="logout()" class="px-3 py-2 rounded-xl bg-red-500/15 text-red-300 hover:bg-red-500/25 text-xs font-semibold">로그아웃</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">회원</div><div id="user-count" class="text-2xl font-extrabold mt-1">-</div></div>
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">캐릭터</div><div id="character-count" class="text-2xl font-extrabold mt-1">-</div></div>
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">내 계정</div><div class="text-lg font-extrabold mt-1">admin</div></div>
    <div class="stat card rounded-2xl p-4"><div class="text-xs text-slate-400">상태</div><div class="text-lg font-extrabold text-emerald-400 mt-1">관리자</div></div>
  </section>

  <section class="card rounded-2xl overflow-hidden">
    <div class="px-4 py-4 border-b border-white/10 flex items-center justify-between">
      <div><h2 class="font-bold">회원 관리</h2><p class="text-xs text-slate-500 mt-1">가입된 계정을 확인하고 삭제할 수 있습니다.</p></div>
      <button onclick="loadAll()" class="px-3 py-2 rounded-xl bg-cyan-500/15 text-cyan-300 text-xs font-semibold hover:bg-cyan-500/25">새로고침</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-white/[.03] text-xs text-slate-400">
          <tr><th class="text-left px-4 py-3">아이디</th><th class="text-left px-4 py-3">닉네임</th><th class="text-left px-4 py-3">가입일</th><th class="text-right px-4 py-3">관리</th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </section>

  <section class="card rounded-2xl overflow-hidden">
    <div class="px-4 py-4 border-b border-white/10">
      <h2 class="font-bold">캐릭터 관리</h2>
      <p class="text-xs text-slate-500 mt-1">온라인에 게시된 캐릭터를 확인하고 삭제할 수 있습니다.</p>
    </div>
    <div id="characters-list" class="divide-y divide-white/10"></div>
  </section>
</main>
</div>

<div id="user-modal" class="hidden fixed inset-0 z-50 modal-bg items-center justify-center p-4">
  <div class="modal-card rounded-2xl w-full max-w-md p-5">
    <div class="flex items-center justify-between mb-5"><div><div class="text-xs text-cyan-400 font-bold">MEMBER EDIT</div><h3 class="text-lg font-extrabold">회원 정보 수정</h3></div><button onclick="closeUserModal()" class="w-9 h-9 rounded-xl bg-white/5 text-slate-400 hover:bg-white/10">✕</button></div>
    <input id="edit-user-username" type="hidden">
    <div class="mb-4"><label class="label">아이디</label><div id="edit-user-id" class="px-3 py-2.5 rounded-xl bg-white/[.03] text-slate-400 text-sm"></div></div>
    <div class="mb-4"><label class="label">닉네임</label><input id="edit-user-nickname" class="input" maxlength="20"></div>
    <div class="mb-5"><label class="label">새 비밀번호 <span class="text-slate-600">(비워두면 변경 안 함)</span></label><input id="edit-user-password" class="input" type="password" minlength="6" maxlength="100" placeholder="6자 이상"></div>
    <div class="flex gap-2"><button onclick="closeUserModal()" class="flex-1 px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold">취소</button><button onclick="saveUserEdit()" class="flex-1 px-4 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-extrabold">저장</button></div>
  </div>
</div>

<div id="character-modal" class="hidden fixed inset-0 z-50 modal-bg items-center justify-center p-4">
  <div class="modal-card rounded-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto p-5">
    <div class="flex items-center justify-between mb-5"><div><div class="text-xs text-cyan-400 font-bold">CHARACTER EDIT</div><h3 class="text-lg font-extrabold">캐릭터 수정</h3></div><button onclick="closeCharacterModal()" class="w-9 h-9 rounded-xl bg-white/5 text-slate-400 hover:bg-white/10">✕</button></div>
    <input id="edit-character-id" type="hidden">
    <div class="grid sm:grid-cols-2 gap-4">
      <div><label class="label">캐릭터 이름</label><input id="edit-char-name" class="input" maxlength="500"></div>
      <div><label class="label">카테고리</label><input id="edit-char-category" class="input" maxlength="500"></div>
      <div class="sm:col-span-2"><label class="label">아바타 이미지 URL</label><input id="edit-char-avatar" class="input" maxlength="500"></div>
      <div class="sm:col-span-2"><label class="label">태그 <span class="text-slate-600">쉼표로 구분</span></label><input id="edit-char-tags" class="input" maxlength="500"></div>
      <div class="sm:col-span-2"><label class="label">성격</label><textarea id="edit-char-personality" class="input min-h-28 resize-y" maxlength="500"></textarea></div>
      <div class="sm:col-span-2"><label class="label">시나리오</label><textarea id="edit-char-scenario" class="input min-h-28 resize-y" maxlength="500"></textarea></div>
      <div class="sm:col-span-2"><label class="label">첫 메시지</label><textarea id="edit-char-first" class="input min-h-24 resize-y" maxlength="500"></textarea></div>
    </div>
    <div class="mt-5 flex gap-2"><button onclick="closeCharacterModal()" class="flex-1 px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold">취소</button><button onclick="saveCharacterEdit()" class="flex-1 px-4 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-extrabold">저장</button></div>
  </div>
</div>

<script>
const WORKER = "https://zeta-ai.pjy-server.workers.dev";
const TOKEN_KEY = "zeta_session";
let characterCache = {};

function token() {
  return localStorage.getItem(TOKEN_KEY);
}

async function api(path, options={}) {
  const headers = {
    ...(options.headers || {}),
    Authorization: "Bearer " + token()
  };

  const res = await fetch(WORKER + path, {...options, headers});
  const data = await res.json().catch(()=>({}));

  if (!res.ok) {
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem(TOKEN_KEY);
      location.href = "./";
    }
    throw new Error(data.error || `요청 실패 (${res.status})`);
  }
  return data;
}

function jsq(value) { return JSON.stringify(String(value ?? "")).replaceAll("\\", "\\\\").replaceAll("'", "\\'"); }

function esc(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function date(v) {
  if (!v) return "-";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "-" : d.toLocaleString("ko-KR");
}

async function checkAdmin() {
  const t = token();
  if (!t) {
    location.href = "./";
    return;
  }

  try {
    const data = await api("/auth/me");
    if (data.user.username !== "admin") {
      alert("관리자 계정만 접근할 수 있습니다.");
      location.href = "./";
      return;
    }

    document.getElementById("admin-info").textContent =
      `${data.user.nickname} (${data.user.username})`;
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    await loadAll();
  } catch (e) {
    alert(e.message);
    location.href = "./";
  }
}

async function loadAll() {
  try {
    const [usersData, charsData] = await Promise.all([
      api("/admin/users"),
      api("/admin/characters")
    ]);

    renderUsers(usersData.users || []);
    renderCharacters(charsData.characters || []);
  } catch (e) {
    alert(e.message);
  }
}

function renderUsers(users) {
  document.getElementById("user-count").textContent = users.length;

  const body = document.getElementById("users-body");

  if (!users.length) {
    body.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">회원이 없습니다.</td></tr>`;
    return;
  }

  body.innerHTML = users.map(user => `
    <tr class="border-t border-white/5 hover:bg-white/[.025]">
      <td class="px-4 py-3 font-semibold">${esc(user.username)}</td>
      <td class="px-4 py-3 text-slate-300">${esc(user.nickname)}</td>
      <td class="px-4 py-3 text-xs text-slate-500">${date(user.createdAt)}</td>
      <td class="px-4 py-3 text-right">
        ${user.username === "admin"
          ? `<span class="text-xs text-cyan-400 font-semibold mr-2">관리자</span><button onclick='openUserModal(${jsq(user.username)}, ${jsq(user.nickname || "")})' class="px-3 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-300 text-xs hover:bg-cyan-500/20">닉네임</button>`
          : `<button onclick='openUserModal(${jsq(user.username)}, ${jsq(user.nickname || "")})' class="px-3 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-300 text-xs hover:bg-cyan-500/20 mr-1">수정</button><button onclick='deleteUser(${JSON.stringify(user.username)})' class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-300 text-xs hover:bg-red-500/20">삭제</button>`
        }
      </td>
    </tr>
  `).join("");
}

function renderCharacters(chars) {
  document.getElementById("character-count").textContent = chars.length;
  const box = document.getElementById("characters-list");

  if (!chars.length) {
    box.innerHTML = `<div class="p-8 text-center text-slate-500">게시된 캐릭터가 없습니다.</div>`;
    return;
  }

  characterCache = Object.fromEntries(chars.map(c => [c.id, c]));
  box.innerHTML = chars.map(c => `
    <div class="p-4 flex gap-3 items-center">
      <img src="${esc(c.avatar)}" class="w-14 h-14 rounded-xl object-cover bg-slate-800" onerror="this.style.visibility='hidden'">
      <div class="min-w-0 flex-1">
        <div class="font-bold truncate">${esc(c.name)}</div>
        <div class="text-xs text-slate-400 mt-1">
          ${esc(c.category || "기타")} · 생성자: <span class="text-cyan-300">${esc(c.creator || "ZETA Community")}</span>
        </div>
        <div class="text-[11px] text-slate-600 mt-1">${date(c.createdAt)}</div>
      </div>
      <button onclick='openCharacterModalById(${jsq(c.id)})' class="shrink-0 px-3 py-2 rounded-xl bg-cyan-500/10 text-cyan-300 text-xs hover:bg-cyan-500/20 mr-1">수정</button><button onclick='deleteCharacter(${JSON.stringify(c.id)})' class="shrink-0 px-3 py-2 rounded-xl bg-red-500/10 text-red-300 text-xs hover:bg-red-500/20">삭제</button>
    </div>
  `).join("");
}

async function deleteUser(username) {
  const name = username;
  if (!confirm(`'${name}' 계정을 삭제할까요?\\n이 작업은 되돌릴 수 없습니다.`)) return;

  try {
    await api(`/admin/users?username=${encodeURIComponent(username)}`, {method:"DELETE"});
    await loadAll();
  } catch(e) {
    alert(e.message);
  }
}

async function deleteCharacter(id) {
  const value = id;
  if (!confirm(`이 캐릭터를 삭제할까요?\\n이 작업은 되돌릴 수 없습니다.`)) return;

  try {
    await api(`/admin/characters?id=${encodeURIComponent(id)}`, {method:"DELETE"});
    await loadAll();
  } catch(e) {
    alert(e.message);
  }
}


function openUserModal(username, nickname) {
  document.getElementById("edit-user-username").value = username;
  document.getElementById("edit-user-id").textContent = username;
  document.getElementById("edit-user-nickname").value = nickname || "";
  document.getElementById("edit-user-password").value = "";
  const modal = document.getElementById("user-modal");
  modal.classList.remove("hidden");
  modal.classList.add("flex");
}

function closeUserModal() {
  const modal = document.getElementById("user-modal");
  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

async function saveUserEdit() {
  const username = document.getElementById("edit-user-username").value;
  const nickname = document.getElementById("edit-user-nickname").value.trim();
  const password = document.getElementById("edit-user-password").value;
  if (!nickname) return alert("닉네임을 입력해주세요.");
  if (nickname.length > 20) return alert("닉네임은 20자 이하로 입력해주세요.");
  if (password && password.length < 6) return alert("새 비밀번호는 6자 이상이어야 합니다.");

  try {
    await api(`/admin/users?username=${encodeURIComponent(username)}`, {
      method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({nickname})
    });
    if (password) {
      await api(`/admin/users/reset-password?username=${encodeURIComponent(username)}`, {
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password})
      });
      alert("닉네임 변경 + 비밀번호 초기화 완료! 기존 로그인 세션도 종료되었습니다.");
    } else {
      alert("닉네임이 변경되었습니다.");
    }
    closeUserModal();
    await loadAll();
  } catch(e) { alert(e.message); }
}

function openCharacterModalById(id) {
  const c = characterCache[id];
  if (!c) return alert("캐릭터 정보를 찾을 수 없습니다.");
  document.getElementById("edit-character-id").value = c.id || "";
  document.getElementById("edit-char-name").value = c.name || "";
  document.getElementById("edit-char-category").value = c.category || "";
  document.getElementById("edit-char-avatar").value = c.avatar || "";
  document.getElementById("edit-char-tags").value = Array.isArray(c.tags) ? c.tags.join(", ") : "";
  document.getElementById("edit-char-personality").value = c.personality || "";
  document.getElementById("edit-char-scenario").value = c.scenario || "";
  document.getElementById("edit-char-first").value = c.firstMessage || "";
  const modal = document.getElementById("character-modal");
  modal.classList.remove("hidden");
  modal.classList.add("flex");
}

function closeCharacterModal() {
  const modal = document.getElementById("character-modal");
  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

async function saveCharacterEdit() {
  const id = document.getElementById("edit-character-id").value;
  const character = {
    name: document.getElementById("edit-char-name").value.trim(),
    category: document.getElementById("edit-char-category").value.trim(),
    avatar: document.getElementById("edit-char-avatar").value.trim(),
    tags: document.getElementById("edit-char-tags").value.split(",").map(v=>v.trim()).filter(Boolean),
    personality: document.getElementById("edit-char-personality").value.trim(),
    scenario: document.getElementById("edit-char-scenario").value.trim(),
    firstMessage: document.getElementById("edit-char-first").value.trim()
  };
  if (!character.name || !character.personality || !character.scenario || !character.firstMessage) {
    return alert("이름, 성격, 시나리오, 첫 메시지는 필수입니다.");
  }
  try {
    await api(`/admin/characters?id=${encodeURIComponent(id)}`, {
      method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({character})
    });
    closeCharacterModal();
    alert("캐릭터가 수정되었습니다.");
    await loadAll();
  } catch(e) { alert(e.message); }
}

async function logout() {
  try {
    await api("/auth/logout", {method:"POST"});
  } catch {}
  localStorage.removeItem(TOKEN_KEY);
  location.href = "./";
}

checkAdmin();
</script>
</body>
</html>
