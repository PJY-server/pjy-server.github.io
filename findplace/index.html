<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>FindPlace · PJY Server</title><link rel="stylesheet" href="/assets/pjy-app.css"></head><body><main class="app"><div class="top"><div class="brand">PJY</div><div><a class="back" href="/">← PJY Server</a><div class="eyebrow">LOCAL DISCOVERY</div></div></div><h1 class="title">FindPlace 🗺️</h1><p class="subtitle">우리 동네에 있는 나만 알고 싶은 장소를 찾아보고 함께 공유해 보자.</p><section class="panel"><h2 class="section-title">동네 선택</h2><div class="grid"><div class="field"><label for="city">시·도</label><select id="city"><option>서울특별시</option><option>경기도</option><option>인천광역시</option><option>부산광역시</option><option>대전광역시</option><option>대구광역시</option><option>광주광역시</option><option>울산광역시</option><option>세종특별자치시</option><option>강원특별자치도</option><option>충청북도</option><option>충청남도</option><option>전북특별자치도</option><option>전라남도</option><option>경상북도</option><option>경상남도</option><option>제주특별자치도</option></select></div><div class="field"><label for="district">구·시·군 또는 동네 이름</label><input class="input" id="district" placeholder="예: 구로구, 신도림동"></div></div><button class="btn" id="show">이 동네 장소 보기</button></section><section class="panel" style="margin-top:16px"><h2 class="section-title">숨겨진 장소 추가</h2><div class="field"><label for="placeName">장소 이름</label><input class="input" id="placeName" maxlength="70" placeholder="예: 나무 그늘이 좋은 작은 공원"></div><div class="field"><label for="placeArea">대략적인 위치 (선택)</label><input class="input" id="placeArea" maxlength="100" placeholder="예: ○○도서관 근처"></div><div class="field"><label for="category">종류</label><select id="category"><option>공원·놀이터</option><option>산책·자연</option><option>도서관·공부</option><option>먹거리</option><option>재미있는 장소</option><option>기타</option></select></div><div class="field"><label for="description">왜 추천하나요?</label><textarea id="description" maxlength="500" rows="3" placeholder="친구들에게 알려주고 싶은 점을 적어 줘. 집 주소나 개인 연락처는 적지 마!"></textarea></div><button class="btn accent" id="add">장소 추가</button><p class="muted">초기 화면 준비 단계야. 지금 등록한 장소는 이 브라우저에서만 보여. 다른 아이들과 실제로 공유하려면 공용 데이터베이스와 스팸 방지 기능을 연결해야 해.</p></section><section style="margin-top:20px"><div class="row" style="justify-content:space-between"><h2 class="section-title" style="margin:0">장소 목록</h2><span class="pill" id="where">동네를 선택해 줘</span></div><div id="places" class="stack" style="margin-top:12px"></div></section><div class="footer">PJY Server · FindPlace</div></main><script>
const $=s=>document.querySelector(s),KEY='pjy_findplace_demo_v1';let places=JSON.parse(localStorage.getItem(KEY)||'[]'),active='';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function loc(){return $('#city').value+' '+$('#district').value.trim()}function render(){let arr=places.filter(p=>p.loc===active);$('#where').textContent=active||'동네를 선택해 줘';$('#places').innerHTML=arr.length?arr.map(p=>'<article class="card"><div class="row"><span class="pill">'+esc(p.category)+'</span><span class="small">동네 공유 예시</span></div><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.area||'정확한 위치 비공개')+'</div><p>'+esc(p.description||'설명이 없어요.')+'</p></article>').join(''):'<div class="empty">이 동네에 등록된 장소가 없어. 첫 장소를 추가해 봐!</div>'}$('#show').onclick=()=>{if(!$('#district').value.trim())return alert('동네 이름을 입력해 줘.');active=loc();render()};$('#add').onclick=()=>{let name=$('#placeName').value.trim(),district=$('#district').value.trim();if(!district)return alert('먼저 동네를 입력해 줘.');if(!name)return alert('장소 이름을 입력해 줘.');let item={id:crypto.randomUUID(),loc:loc(),name,area:$('#placeArea').value.trim(),category:$('#category').value,description:$('#description').value.trim()};places.unshift(item);localStorage.setItem(KEY,JSON.stringify(places));active=item.loc;$('#placeName').value='';$('#placeArea').value='';$('#description').value='';render()};render();
</script></body></html>
